# electron-builder — portable, single-file offline builds (T004). No installer, no auto-update.
appId: com.kurtvalcorza.pdfsignerpwa
productName: PDF Signer
# asar keeps the app one file inside the artifact; dist/ + electron/ are all that ship.
asar: true
files:
  - dist/**
  - electron/**
  - '!electron/verify-packaged.mjs' # dev/test util (imports playwright) — must not ship in the artifact
  - package.json
# publish: null — FR-007 is satisfied by the ABSENCE of an update feed, not a flag.
publish: null
# Fuses are burned into the shipped binary (issue #33): the Node inspector is now OFF too.
# enableCookieEncryption stays at Electron's default (off) by decision (#36, 2026-11-19): the app sets
# no cookies, so it would protect nothing, and on Linux it may create a desktop-keyring item or prompt,
# which would break the no-trace promise. No real GNOME/KDE session is available to rule that out.
# enableNodeCliInspectArguments is OFF: the packaged gates attach through the inspector, so they
# drive the gate-only probe build (electron-builder.probe.yml) instead, never this one.
# scripts/check-fuses.mjs reads the burned wire back and fails on any drift. --no-sandbox has no fuse.
electronFuses:
  runAsNode: false
  enableCookieEncryption: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
icon: public/icons/icon-512.png
directories:
  output: release
win:
  # Windows portable target = a single self-contained .exe, no installer, no registry (FR-001).
  target: portable
  # Unsigned by design in this feature (FR-014); SmartScreen is disclosed in docs/desktop.md.
linux:
  # Single-file AppImage, no .deb (FR-002). Linux artifacts build on Linux only (R8).
  target: AppImage
  category: Office
  synopsis: Privacy-first, offline, on-device PDF signing
  desktop:
    entry:
      Name: PDF Signer
