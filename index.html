<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1c1e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Strict CSP (research R9): connect-src 'none' blocks fetch, XHR, WebSocket and beacon
      requests. It does not stop top-level navigation, and it cannot protect against a modified
      build, so it is a strong restriction and not a guarantee of no exfiltration.
      vercel.json sends this policy as a header too, with frame-ancestors, which a meta tag
      cannot carry; keep the two in step.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; img-src 'self' data: blob:; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>PDF Signer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
