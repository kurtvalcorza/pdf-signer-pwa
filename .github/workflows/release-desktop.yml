# US4 — build, gate, and publish the portable desktop artifacts (Windows portable + Linux AppImage)
# from ONE commit, with checksums + build-provenance attestation.
# Feature 003 adds the `android` job: the signed APK from the same commit, gated on an emulator, in
# the same SHA256SUMS and release (FR-019, FR-020).
#
# The release gate is authoritative in contracts/release-artifacts.md § Release gate; this workflow
# implements it. Any platform's gate red -> nothing publishes (SC-002): fail-fast matrix + the publish
# job `needs:` every build leg, so a partial release is structurally impossible.
name: release-desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write # provenance attestation (Sigstore OIDC)
      attestations: write # provenance attestation record
    strategy:
      # false so BOTH platforms build/gate to completion and surface their own failures — publish is
      # gated by `needs: build` (every leg must succeed), so a red platform still blocks the release.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            unpacked: 'release/win-unpacked/PDF Signer.exe'
            artifact: 'release/*.exe'
          - os: ubuntu-latest
            unpacked: 'release/linux-unpacked/pdf-signer-pwa'
            artifact: 'release/*.AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r scripts/requirements-verify.txt
      - run: npm ci
      - name: Lint (blocks the release on a layer-3 network-import violation)
        run: npm run lint
      - name: Dependency audit (production dependencies)
        run: npm run audit:gate
      - name: Install Linux headless deps
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build desktop artifact (portable .exe / AppImage) from this commit
        run: npm run build:desktop
      - name: Web gates untouched (SC-008/FR-019)
        run: npm test && npm run verify:signatures

      # --- Per-distribution gate (Principle V — earns its own pass) ---
      - name: Desktop E2E (sign -> pyHanko, portable state, layer 2, US3 surfaces) [Windows]
        if: runner.os == 'Windows'
        run: npx playwright test --config playwright.desktop.config.ts
      - name: Desktop E2E [Linux, xvfb]
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test --config playwright.desktop.config.ts
      - name: Packaged artifact signs a pyHanko-valid PDF [Windows]
        if: runner.os == 'Windows'
        run: node electron/verify-packaged.mjs
      # Gate the ACTUAL AppImage, not linux-unpacked: extract it (the extract-and-run fallback path,
      # FR-002a) and drive the extracted binary, so a broken wrapper / APPIMAGE data-location regression
      # is caught before publish.
      - name: Packaged AppImage signs a pyHanko-valid PDF [Linux, extract-and-run, xvfb]
        if: runner.os == 'Linux'
        run: |
          set -e
          APPIMAGE_PATH=$(ls release/*.AppImage | head -1)
          ( cd release && chmod +x *.AppImage && ./*.AppImage --appimage-extract >/dev/null )
          # PKG_APPIMAGE drives the real Linux APPIMAGE data-location branch (dirname(APPIMAGE)), not
          # the Windows PORTABLE_EXECUTABLE_DIR path — so an AppImage-specific persistence regression
          # is exercised.
          PKG_EXE=release/squashfs-root/pdf-signer-pwa PKG_APPIMAGE="$APPIMAGE_PATH" \
            xvfb-run -a node electron/verify-packaged.mjs
      # SC-004 no-egress gate (network-namespace method, contracts/release-artifacts.md § Verification):
      # run the packaged app with a monitored dummy default route and NO real network, capturing on the
      # namespace's interface. Fail on ANY captured packet over the whole app process tree.
      #
      # ⚠ KNOWN GAP (explicit, not implicit): this packet capture runs on LINUX only. The Windows leg
      # below samples the app's sockets instead: per-process, but a very short-lived connection can
      # fall between samples. A packet-level Windows gate (WFP/pktmon) remains open in issue #23.
      - name: No-egress gate — packet capture over the app process tree (SC-004) [Linux]
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo ip netns add appns
          sudo ip netns exec appns ip link set lo up
          # a routable-but-black-hole default so egress ATTEMPTS are emitted (and captured), not merely
          # refused for lack of a route (which would record nothing — the offline-run trap). Disable
          # IPv6 on the dummy so bringing it up doesn't itself emit ND/router-solicitation multicast.
          sudo ip netns exec appns sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo ip netns exec appns sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo ip netns exec appns ip link add dummy0 type dummy
          sudo ip netns exec appns ip addr add 10.99.0.1/24 dev dummy0
          sudo ip netns exec appns ip link set dummy0 up
          sudo ip netns exec appns ip route add default dev dummy0
          # -U = write each packet immediately (unbuffered); without it libpcap can hold captured
          # packets in its stdio buffer past our read window and report a false COUNT=0.
          sudo ip netns exec appns tcpdump -i any -nn -U -w /tmp/egress.pcap 'not (host 127.0.0.1 or host ::1)' &
          sleep 2
          # Same APPIMAGE data-location branch as the signing gate above, for consistency.
          APPIMAGE_PATH=$(ls release/*.AppImage | head -1)
          # Skip pyHanko here: this run's job is egress monitoring, and pyHanko validation (a) needs a
          # network and (b) could itself emit traffic and pollute the capture. The artifact's signature
          # is validated in the step above, with the network available.
          sudo ip netns exec appns su "$USER" -c \
            "PKG_EXE=release/squashfs-root/pdf-signer-pwa PKG_APPIMAGE='$APPIMAGE_PATH' PDFSIGNER_SKIP_VALIDATE=1 ELECTRON_DISABLE_SANDBOX=1 xvfb-run -a node electron/verify-packaged.mjs"
          sleep 2
          # Stop the capture cleanly (SIGINT makes tcpdump flush + exit) BEFORE reading the pcap.
          sudo pkill -INT -f 'tcpdump.*egress.pcap' || true
          sleep 1
          echo "=== everything captured (for evidence/diagnosis) ==="
          sudo tcpdump -nn -r /tmp/egress.pcap 2>/dev/null || true
          # FAIL on real egress = any UNICAST packet to a non-loopback host. Multicast/broadcast
          # (ND, mDNS, IGMP) is stack noise from configuring the interface, not the app phoning home.
          # Write to a file then count (a piped `wc -l` under pipefail + `|| echo 0` can yield a
          # non-integer that breaks the numeric test).
          sudo tcpdump -nn -r /tmp/egress.pcap 'not multicast and not broadcast' 2>/dev/null > /tmp/egress-unicast.txt || true
          COUNT=$(wc -l < /tmp/egress-unicast.txt | tr -d '[:space:]')
          echo "unicast egress packets from the app process tree: ${COUNT:-unknown}"
          if [ "${COUNT:-1}" != "0" ]; then
            echo "::error::EGRESS DETECTED — the app made a network request (see capture above)."
            exit 1
          fi

      - name: No-egress gate — socket sampling over the app process tree (SC-004) [Windows]
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-egress-check.ps1

      # --- Checksums + provenance for the shipped artifact ---
      # PER-PLATFORM name so the two matrix legs don't both upload a file literally named SHA256SUMS
      # (GitHub release assets must be uniquely named — a collision would fail publish AFTER one leg's
      # assets are attached = a partial release). The publish job MERGES these into one SHA256SUMS.
      - name: Per-platform checksum
        shell: bash
        run: |
          cd release
          # `ls *.exe *.AppImage` fails (set -e) because one glob never matches per platform. List all,
          # then filter — so the present artifact is found on either OS.
          FILE=$(ls | grep -E '\.(exe|AppImage)$' | head -1)
          echo "checksumming: $FILE"
          sha256sum "$FILE" > "SHA256SUMS-${{ runner.os }}"
      - name: Provenance attestation (FR-018a — record in GitHub attestations API, not a release asset)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: ${{ matrix.artifact }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            ${{ matrix.artifact }}
            release/SHA256SUMS-${{ runner.os }}
          if-no-files-found: error

  # Feature 003 (T042): the Android APK, from the same commit. Signed here and nowhere else: the key
  # lives in the `android-release` environment (R12), whose deployment rule allows `v*` tags only,
  # so a run from any other ref skips this job instead of failing on the environment.
  android:
    if: startsWith(github.ref, 'refs/tags/v')
    environment: android-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance attestation (Sigstore OIDC)
      attestations: write # provenance attestation record
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # a tag cut on main makes C9 vacuous here; the PR job's C9 (--base) is the gate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r scripts/requirements-verify.txt
      - run: npm ci
      - name: Web build (copied into the APK unchanged)
        run: npm run build

      - name: Version and tag agree (FR-019)
        id: version
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          # Later steps splice the version into shell lines: allow only a plain semver.
          if ! printf '%s' "$V" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "::error::package.json version '$V' is not a plain semver"
            exit 1
          fi
          if [ "refs/tags/v$V" != "$GITHUB_REF" ]; then
            echo "::error::tag $GITHUB_REF does not match package.json version $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Gradle (allow-list C2, unit tests, unsigned release APK)
        run: node scripts/build-android.mjs verifyDependencyAllowlist testDebugUnitTest assembleRelease

      - name: Build tools (pinned to the version the gate was validated with)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" > /dev/null

      # The keystore exists only in $RUNNER_TEMP, only for this step and the next, and the passwords
      # reach apksigner as environment variables (env:), never as arguments or in the log.
      - name: Sign (v2 + v3)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          BT="$ANDROID_HOME/build-tools/36.1.0"
          KS="$RUNNER_TEMP/release.p12"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$KS"
          mkdir -p out
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-type PKCS12 --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "out/pdf-signer-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "out/pdf-signer-$VERSION.apk"
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/aligned.apk"

      # C1, C3 (the certificate must match the committed android/SIGNING_FINGERPRINT), C4-C7, C9.
      - name: Static APK checks on the signed APK
        env:
          ANDROID_BUILD_TOOLS: '36.1.0' # the version that signed it (the Sign step's $BT)
        run: node scripts/android-check-apk.mjs "out/pdf-signer-${{ steps.version.outputs.version }}.apk" --fingerprint android/SIGNING_FINGERPRINT

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Per-distribution gate (Principle V) on the SIGNED APK that is published. The wrapper first
      # asserts the emulator's WebView major equals android/VALIDATED_WEBVIEW. One script line:
      # this action runs each line of `script` as a separate shell.
      - name: Emulator gate (C8, C10-C12, US1-US3, large files)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/android-release-gate.sh "out/pdf-signer-${{ steps.version.outputs.version }}.apk"

      - name: Checksum
        run: |
          cd out
          sha256sum "pdf-signer-${{ steps.version.outputs.version }}.apk" > SHA256SUMS-Android
          cat SHA256SUMS-Android
      - name: Provenance attestation
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: out/pdf-signer-*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: |
            out/pdf-signer-*.apk
            out/SHA256SUMS-Android
          if-no-files-found: error

  publish:
    # Only runs if BOTH desktop legs AND the Android job succeeded — no partial release (SC-002).
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-artifacts
      # T032a — gate the required USER-FACING disclosures before publishing. The unsigned-binary
      # warning promises a verification path and the FUSE-less fallback is the only no-root Linux path,
      # so publishing without them is an overclaim. (Assets are gated by upload-artifact if-no-files.)
      - name: Gate release disclosures present (FR-014/015/018a/002a)
        run: |
          set -e
          D=docs/desktop.md
          for needle in "SmartScreen" "does not update itself" "gh attestation verify" "appimage-extract-and-run" "no user content remains"; do
            grep -qiF "$needle" "$D" || { echo "MISSING disclosure in $D: $needle"; exit 1; }
          done
          # Feature 003, FR-016/FR-018: outside the store, no self-update, how to verify, what the
          # missing network permission does and doesn't cover.
          A=docs/android.md
          for needle in "does not update itself" "apksigner verify --print-certs" "gh attestation verify" "no network permission"; do
            grep -qiF "$needle" "$A" || { echo "MISSING disclosure in $A: $needle"; exit 1; }
          done
          echo "All required disclosures present."
      # Merge the per-platform checksums into ONE SHA256SUMS (what docs/desktop.md tells users to
      # `sha256sum -c`), and stage the artifacts under unique names for the release.
      - name: Assemble release files
        run: |
          set -e
          mkdir -p out
          # GitHub renames release assets, turning spaces into dots, so use those names here. Otherwise
          # the published SHA256SUMS lists files that do not exist and `sha256sum -c` fails.
          cat dist-artifacts/**/SHA256SUMS-* |
            awk '{ hash = $1; sub(/^[0-9a-f]+ +\*?/, ""); gsub(/ /, "."); print hash "  " $0 }' > out/SHA256SUMS
          find dist-artifacts -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.apk' \) -print0 |
            while IFS= read -r -d '' file; do
              name=$(basename "$file")
              cp "$file" "out/${name// /.}"
            done
          echo "--- SHA256SUMS ---"; cat out/SHA256SUMS
          # The published checksums must verify against the files actually being uploaded.
          ( cd out && sha256sum -c SHA256SUMS )
          # FR-016: the release notes carry the Android disclosures too. Outside out/, so it is not
          # uploaded as an asset. The one repository-relative link is made absolute at this tag.
          {
            cat docs/desktop.md
            printf '\n---\n\n'
            sed "s#](\.\./android/#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/android/#g" docs/android.md
          } > release-notes.md
          if grep -n '](\.\./' release-notes.md; then echo "relative link left in release notes"; exit 1; fi
      - name: Publish release with artifacts + checksums
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
