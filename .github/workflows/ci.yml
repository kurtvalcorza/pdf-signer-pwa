name: CI

# Ordinary CI: web build, lint, dependency audit, unit + signing tests, signature policy gate, browser
# E2E, the desktop shell (renderer sandbox included) run unpackaged on Windows and Linux, and the
# Android shell built unsigned with its static APK checks. Packaged desktop artifacts, fuses, APK
# signing and the emulator gates run only in release-desktop.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Constitution Principle V: the signing path is not "done" until an automatable
  # validator confirms the signature. This job is that gate.
  verify:
    name: Build, tests & signature gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install pyHanko (signature validator)
        run: pip install --require-hashes -r scripts/requirements-verify.txt

      - name: Lint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build

      - name: Dependency audit (production dependencies)
        run: npm run audit:gate

      - name: Unit & signing tests
        run: npm test

      # Produces real signed PDFs and validates them with pyHanko: every signature must pass
      # integrity and modification policy, and the tampered and policy-violating fixtures must each
      # be caught for that specific reason (SC-007, SEC-02).
      - name: Signature gate (pyHanko)
        run: npm run verify:signatures

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (signing flows)
        run: npm run e2e

      # Offline/installability runs against the production build (service worker
      # + precache only exist there).
      - name: E2E (PWA offline & installability)
        run: npm run e2e:pwa

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  desktop:
    name: Desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install pyHanko (signature validator)
        run: pip install --require-hashes -r scripts/requirements-verify.txt

      - name: Allow the Chromium sandbox [Linux]
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Desktop E2E [Linux, xvfb]
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e:desktop

      - name: Desktop E2E [Windows]
        if: runner.os == 'Windows'
        run: npm run e2e:desktop

  # Feature 003: the Android shell, unsigned. No secrets and no environment: the release key is
  # only readable by the release job (R12). C3 (signing certificate) and the emulator gates
  # (C8, C10-C12) need the signed APK and run in release-desktop.yml.
  android:
    name: Android shell (unsigned build + static APK checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # C9 diffs the shared paths against the merge-base with the target branch

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Web build (dist/ is copied into the APK unchanged)
        run: npm run build

      # C2 (dependency allow-list) runs inside Gradle; the unit tests cover the shell's pure rules.
      - name: Gradle (allow-list, unit tests, unsigned release APK)
        run: node scripts/build-android.mjs verifyDependencyAllowlist testDebugUnitTest assembleRelease

      - name: Static APK checks (C1, C4-C7, C9)
        env:
          TARGET: ${{ github.base_ref || 'main' }}
        run: |
          base=$(git merge-base HEAD "origin/$TARGET")
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          node scripts/android-check-apk.mjs "$apk" --skip-c3 --base "$base"
